name: Build portable EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build DeckShare.sln --configuration Release

      - name: Publish portable EXE
        shell: pwsh
        run: .\build-portable.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DeckShare-portable-win-x64
          path: dist/DeckShare.exe

      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeckShare.exe
